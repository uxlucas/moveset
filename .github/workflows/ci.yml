name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: skills/ is committed up to date
        run: |
          git diff --exit-code -- skills/ || { echo "skills/ is stale: run npm run generate and commit skills/"; exit 1; }
          test -z "$(git ls-files --others --exclude-standard -- skills/)" || { echo "skills/ has uncommitted files: run npm run generate and commit skills/"; exit 1; }
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
